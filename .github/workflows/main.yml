name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract Android project
    run: |
      unzip -o ED​ELE-Android-Starter-with-APK-build.zip -d android-project
      find android-project -name gradlew -type f

  - name: Build APK
    run: |
      GRADLEW=$(find android-project -name gradlew -type f | head -n 1)
      if [ -z "$GRADLEW" ]; then
        echo "Gradle project not found in ZIP"
        exit 1
      fi
      cd "$(dirname "$GRADLEW")"
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: ED​ELE-APK
      path: android-project/**/build/outputs/apk/debug/*.apk
